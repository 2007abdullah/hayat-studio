name: CI/CD

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check app tests --select E9,F63,F7,F82,F401 --ignore F401
      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package.json }
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          BACKEND_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: https://example.com

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hayat-backend ./backend
      - run: docker build -t hayat-frontend --build-arg BACKEND_URL=http://backend:8000 ./frontend

  deploy:
    # Runs only on main and only if every job above passed.
    needs: [backend, frontend, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy backend (Railway)
        if: ${{ vars.RAILWAY_ENABLED == 'true' }}
        run: |
          npm i -g @railway/cli
          railway up --service "${{ vars.RAILWAY_SERVICE }}" --detach
        working-directory: backend
        env: { RAILWAY_TOKEN: "${{ secrets.RAILWAY_TOKEN }}" }
      - name: Deploy frontend (Vercel)
        if: ${{ vars.VERCEL_ENABLED == 'true' }}
        run: |
          npm i -g vercel
          vercel pull --yes --environment=production --token "${{ secrets.VERCEL_TOKEN }}"
          vercel build --prod --token "${{ secrets.VERCEL_TOKEN }}"
          vercel deploy --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}"
        working-directory: frontend
        env:
          VERCEL_ORG_ID: "${{ secrets.VERCEL_ORG_ID }}"
          VERCEL_PROJECT_ID: "${{ secrets.VERCEL_PROJECT_ID }}"
