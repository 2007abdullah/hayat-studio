services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hayat_studio
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    ports: ["5432:5432"]

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/hayat_studio
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      LOCAL_UPLOAD_DIR: /srv/uploads
    volumes: [uploads:/srv/uploads]
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      args: { BACKEND_URL: http://backend:8000 }
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
  uploads:
